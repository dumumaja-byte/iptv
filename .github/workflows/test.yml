name: Build Working IPTV

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build checked playlist
        run: |
          python3 - <<'PY'
          import re
          import urllib.request
          from urllib.parse import urlsplit
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from collections import Counter

          UA = "Mozilla/5.0"

          SOURCES = [
              ("Русское ТВ", "https://iptv-org.github.io/iptv/languages/rus.m3u"),
              ("Русское ТВ", "https://iptv-org.github.io/iptv/countries/ru.m3u"),

              ("Латвия", "https://iptv-org.github.io/iptv/countries/lv.m3u"),
              ("Латвия", "https://iptv-org.github.io/iptv/languages/lav.m3u"),

              ("Русское ТВ", "https://1iptv.ru/tv/russia.m3u"),

              ("Музыка", "https://1iptv.ru/tv/music.m3u"),

              ("Спорт", "https://1iptv.ru/tv/f1.m3u"),
              ("Спорт", "https://1iptv.ru/tv/f2.m3u"),
              ("Спорт", "https://1iptv.ru/tv/f3.m3u"),
              ("Спорт", "https://1iptv.ru/tv/f4.m3u"),

              ("Русское кино", "https://1iptv.ru/tv/kinokanaly.m3u"),

              ("Фильмы HD", "https://1iptv.ru/tv/filmhd.m3u"),
              ("Фильмы и сериалы", "https://1iptv.ru/tv/Films.m3u"),

              ("18+", "https://1iptv.ru/tv/18.m3u")
          ]

          bad_ext = (
              ".png", ".jpg", ".jpeg",
              ".gif", ".webp", ".svg", ".ico"
          )

          def download(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": UA,
                      "Accept": "*/*",
                      "Accept-Encoding": "identity"
                  }
              )

              with urllib.request.urlopen(req, timeout=45) as r:
                  return r.read().decode(
                      "utf-8-sig",
                      errors="ignore"
                  )

          def set_group(info, group):
              if re.search(
                  r'group-title="[^"]*"',
                  info,
                  flags=re.I
              ):
                  return re.sub(
                      r'group-title="[^"]*"',
                      'group-title="' + group + '"',
                      info,
                      count=1,
                      flags=re.I
                  )

              comma = info.rfind(",")

              if comma == -1:
                  return info

              return (
                  info[:comma]
                  + ' group-title="'
                  + group
                  + '"'
                  + info[comma:]
              )

          candidates = []
          seen = set()

          for group, src in SOURCES:

              print("DOWNLOAD:", src)

              try:
                  text = download(src)
              except Exception as e:
                  print("SOURCE ERROR:", src, e)
                  continue

              lines = (
                  text.replace("\r\n", "\n")
                      .replace("\r", "\n")
                      .split("\n")
              )

              info = None
              extra = []

              for raw in lines:

                  line = raw.strip()

                  if not line:
                      continue

                  if line.startswith("#EXTM3U"):
                      continue

                  if line.startswith("#EXTINF"):
                      info = line
                      extra = []
                      continue

                  if info is not None and line.startswith("#"):
                      extra.append(line)
                      continue

                  if info is None:
                      continue

                  if not line.lower().startswith(
                      ("http://", "https://")
                  ):
                      info = None
                      extra = []
                      continue

                  try:
                      path = urlsplit(line).path.lower()
                  except:
                      path = ""

                  if path.endswith(bad_ext):
                      info = None
                      extra = []
                      continue

                  key = line.lower()

                  if key in seen:
                      info = None
                      extra = []
                      continue

                  seen.add(key)

                  candidates.append({
                      "group": group,
                      "info": set_group(info, group),
                      "extra": extra[:],
                      "url": line
                  })

                  info = None
                  extra = []

          print("CANDIDATES:", len(candidates))

          def validate(item):

              headers = {
                  "User-Agent": UA,
                  "Accept": "*/*",
                  "Accept-Encoding": "identity",
                  "Range": "bytes=0-4095"
              }

              for x in item["extra"]:

                  low = x.lower()

                  if low.startswith(
                      "#extvlcopt:http-user-agent="
                  ):
                      headers["User-Agent"] = x.split(
                          "=", 1
                      )[1]

                  if low.startswith(
                      "#extvlcopt:http-referrer="
                  ):
                      headers["Referer"] = x.split(
                          "=", 1
                      )[1]

              try:
                  req = urllib.request.Request(
                      item["url"],
                      headers=headers
                  )

                  with urllib.request.urlopen(
                      req,
                      timeout=7
                  ) as r:

                      status = getattr(r, "status", 200)

                      if status >= 400:
                          return False

                      data = r.read(4096)

                      if not data:
                          return False

                      path = urlsplit(
                          item["url"]
                      ).path.lower()

                      ctype = (
                          r.headers.get(
                              "Content-Type",
                              ""
                          ).lower()
                      )

                      upper = data.upper()

                      if (
                          ".m3u8" in path
                          or "mpegurl" in ctype
                      ):
                          return b"#EXTM3U" in upper

                      if ".mpd" in path:
                          return b"<MPD" in upper

                      return True

              except:
                  return False

          working = []

          with ThreadPoolExecutor(
              max_workers=32
          ) as executor:

              future_map = {
                  executor.submit(
                      validate,
                      item
                  ): item
                  for item in candidates
              }

              done = 0

              for future in as_completed(
                  future_map
              ):

                  item = future_map[future]

                  try:
                      ok = future.result()
                  except:
                      ok = False

                  if ok:
                      working.append(item)

                  done += 1

                  if done % 250 == 0:
                      print(
                          "CHECKED:",
                          done,
                          "WORKING:",
                          len(working)
                      )

          order = {
              "Русское ТВ": 1,
              "Русское кино": 2,
              "Фильмы HD": 3,
              "Фильмы и сериалы": 4,
              "Спорт": 5,
              "Музыка": 6,
              "Латвия": 7,
              "18+": 8
          }

          working.sort(
              key=lambda x: (
                  order.get(
                      x["group"],
                      99
                  ),
                  x["info"].rsplit(
                      ",",
                      1
                  )[-1].lower()
              )
          )

          with open(
              "working.m3u",
              "w",
              encoding="utf-8",
              newline="\n"
          ) as f:

              f.write("#EXTM3U\n")

              for item in working:

                  f.write(
                      item["info"] + "\n"
                  )

                  for line in item["extra"]:
                      f.write(line + "\n")

                  f.write(
                      item["url"] + "\n"
                  )

          counts = Counter(
              x["group"]
              for x in working
          )

          with open(
              "working-report.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  "CHECKED: "
                  + str(len(candidates))
                  + "\n"
              )

              f.write(
                  "WORKING: "
                  + str(len(working))
                  + "\n\n"
              )

              for group in order:
                  f.write(
                      group
                      + ": "
                      + str(counts[group])
                      + "\n"
                  )

          print("TOTAL WORKING:", len(working))

          for group in order:
              print(
                  group,
                  counts[group]
              )

          PY

      - name: Save playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add working.m3u working-report.txt

          git diff --cached --quiet && exit 0

          git commit -m "Update working IPTV playlist"
          git push
