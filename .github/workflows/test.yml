name: Build RU 3000 IPTV

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Russian playlist
        run: |
          python3 - <<'PY'
          import re
          import urllib.request
          from collections import Counter

          SOURCES = [
              ("Русское ТВ", "https://iptv-org.github.io/iptv/languages/rus.m3u"),
              ("Русское ТВ", "https://iptv-org.github.io/iptv/countries/ru.m3u"),

              ("Латвия", "https://iptv-org.github.io/iptv/countries/lv.m3u"),
              ("Латвия", "https://iptv-org.github.io/iptv/languages/lav.m3u"),

              ("Русское ТВ", "https://1iptv.ru/tv/russia.m3u"),

              ("Музыка", "https://1iptv.ru/tv/music.m3u"),

              ("Спорт", "https://1iptv.ru/tv/f1.m3u"),
              ("Спорт", "https://1iptv.ru/tv/f2.m3u"),
              ("Спорт", "https://1iptv.ru/tv/f3.m3u"),
              ("Спорт", "https://1iptv.ru/tv/f4.m3u"),

              ("18+", "https://1iptv.ru/tv/18.m3u"),

              ("Русское кино", "https://1iptv.ru/tv/kinokanaly.m3u"),
              ("Фильмы HD", "https://1iptv.ru/tv/filmhd.m3u"),
              ("Фильмы и сериалы", "https://1iptv.ru/tv/Films.m3u"),

              ("Русское ТВ", "https://1iptv.ru/tv/freeiptv.m3u")
          ]

          UA = "Mozilla/5.0"

          seen_urls = set()
          entries = []

          BAD_EXT = (
              ".png", ".jpg", ".jpeg",
              ".gif", ".webp", ".svg", ".ico"
          )

          def download(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": UA,
                      "Accept": "*/*"
                  }
              )

              with urllib.request.urlopen(
                  req,
                  timeout=60
              ) as r:
                  return r.read().decode(
                      "utf-8-sig",
                      errors="ignore"
                  )

          def set_group(info, group):

              if re.search(
                  r'group-title="[^"]*"',
                  info,
                  flags=re.I
              ):
                  return re.sub(
                      r'group-title="[^"]*"',
                      'group-title="' + group + '"',
                      info,
                      count=1,
                      flags=re.I
                  )

              comma = info.rfind(",")

              if comma == -1:
                  return info

              return (
                  info[:comma]
                  + ' group-title="'
                  + group
                  + '"'
                  + info[comma:]
              )

          for group, src in SOURCES:

              print("DOWNLOAD:", group, src)

              try:
                  text = download(src)

              except Exception as e:
                  print("ERROR:", src, e)
                  continue

              lines = (
                  text.replace("\r\n", "\n")
                      .replace("\r", "\n")
                      .split("\n")
              )

              info = None
              extra = []

              for raw in lines:

                  line = raw.strip()

                  if not line:
                      continue

                  if line.startswith("#EXTM3U"):
                      continue

                  if line.startswith("#EXTINF"):
                      info = line
                      extra = []
                      continue

                  if info is not None and line.startswith("#"):
                      extra.append(line)
                      continue

                  if info is None:
                      continue

                  if not line.lower().startswith(
                      (
                          "http://",
                          "https://",
                          "rtmp://",
                          "rtsp://",
                          "udp://",
                          "acestream://"
                      )
                  ):
                      info = None
                      extra = []
                      continue

                  check_url = line.split("|")[0].lower()

                  if check_url.endswith(BAD_EXT):
                      info = None
                      extra = []
                      continue

                  key = line.lower()

                  # Убираем только полностью одинаковые URL
                  if key in seen_urls:
                      info = None
                      extra = []
                      continue

                  seen_urls.add(key)

                  entries.append(
                      (
                          group,
                          set_group(info, group),
                          extra[:],
                          line
                      )
                  )

                  info = None
                  extra = []

          ORDER = {
              "Русское ТВ": 1,
              "Русское кино": 2,
              "Фильмы HD": 3,
              "Фильмы и сериалы": 4,
              "Спорт": 5,
              "Музыка": 6,
              "Латвия": 7,
              "18+": 8
          }

          entries.sort(
              key=lambda x: (
                  ORDER.get(x[0], 99),
                  x[1].rsplit(",", 1)[-1].lower()
              )
          )

          with open(
              "rus3000.m3u",
              "w",
              encoding="utf-8",
              newline="\n"
          ) as f:

              f.write("#EXTM3U\n")

              for group, info, extra, url in entries:

                  f.write(info + "\n")

                  for option in extra:
                      f.write(option + "\n")

                  f.write(url + "\n")

          counts = Counter(
              group
              for group, _, _, _ in entries
          )

          with open(
              "rus3000-report.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write("TOTAL: " + str(len(entries)) + "\n\n")

              for group in ORDER:
                  f.write(
                      group
                      + ": "
                      + str(counts[group])
                      + "\n"
                  )

          print("TOTAL:", len(entries))

          for group in ORDER:
              print(group, counts[group])

          PY

      - name: Save playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add rus3000.m3u rus3000-report.txt

          git diff --cached --quiet && exit 0

          git commit -m "Build RU 3000 IPTV playlist"
          git push