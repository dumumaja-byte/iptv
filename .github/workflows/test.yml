name: Build Test IPTV

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build test playlist
        run: |
          python3 - <<'PY'
          import urllib.request

          sources = [
              "https://iptv-org.github.io/iptv/languages/rus.m3u",
              "https://iptv-org.github.io/iptv/categories/movies.m3u",
              "https://iptv-org.github.io/iptv/categories/series.m3u",
              "https://iptv-org.github.io/iptv/categories/music.m3u",
              "https://iptv-org.github.io/iptv/categories/sports.m3u"
          ]

          seen = set()
          entries = []

          for src in sources:
              try:
                  req = urllib.request.Request(
                      src,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )

                  text = urllib.request.urlopen(
                      req,
                      timeout=45
                  ).read().decode(
                      "utf-8-sig",
                      errors="ignore"
                  )

              except Exception as e:
                  print("SOURCE ERROR:", src, e)
                  continue

              info = None
              extra = []

              for raw in text.replace("\r", "").split("\n"):
                  line = raw.strip()

                  if not line:
                      continue

                  if line.startswith("#EXTINF"):
                      info = line
                      extra = []
                      continue

                  if info is not None and line.startswith("#"):
                      extra.append(line)
                      continue

                  if info is None:
                      continue

                  if not line.startswith(("http://", "https://")):
                      info = None
                      extra = []
                      continue

                  key = line.lower()

                  if key in seen:
                      info = None
                      extra = []
                      continue

                  seen.add(key)
                  entries.append((info, extra[:], line))

                  info = None
                  extra = []

          with open(
              "test.m3u",
              "w",
              encoding="utf-8",
              newline="\n"
          ) as f:

              f.write("#EXTM3U\n")

              for info, extra, url in entries:
                  f.write(info + "\n")

                  for x in extra:
                      f.write(x + "\n")

                  f.write(url + "\n")

          print("TOTAL:", len(entries))
          PY

      - name: Save playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add test.m3u
          git diff --cached --quiet && exit 0

          git commit -m "Build test IPTV playlist"
          git push
