name: Update Full IPTV

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "17 */12 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build full playlist
        run: |
          python3 - <<'PY'
          import re
          import urllib.request
          from urllib.parse import urlsplit

          SOURCES = [
              ("Русские", "https://iptv-org.github.io/iptv/languages/rus.m3u"),
              ("Россия", "https://iptv-org.github.io/iptv/countries/ru.m3u"),

              ("Русские", "https://1iptv.ru/tv/russia.m3u"),
              ("Музыка", "https://1iptv.ru/tv/music.m3u"),

              ("Спорт", "https://1iptv.ru/tv/f1.m3u"),
              ("Спорт", "https://1iptv.ru/tv/f2.m3u"),
              ("Спорт", "https://1iptv.ru/tv/f3.m3u"),
              ("Спорт", "https://1iptv.ru/tv/f4.m3u"),

              ("18+", "https://1iptv.ru/tv/18.m3u"),

              ("Кино", "https://1iptv.ru/tv/kinokanaly.m3u"),
              ("ТВ", "https://1iptv.ru/tv/freeiptv.m3u"),
              ("Фильмы HD", "https://1iptv.ru/tv/filmhd.m3u"),
              ("Фильмы и сериалы", "https://1iptv.ru/tv/Films.m3u")
          ]

          UA = "Mozilla/5.0"

          allowed_schemes = (
              "http://",
              "https://",
              "rtmp://",
              "rtsp://",
              "udp://",
              "acestream://"
          )

          bad_extensions = (
              ".png", ".jpg", ".jpeg",
              ".gif", ".webp", ".svg",
              ".ico"
          )

          def add_group(extinf, group):
              if 'group-title=' in extinf.lower():
                  return extinf

              if extinf.startswith("#EXTINF:"):
                  comma = extinf.rfind(",")

                  if comma != -1:
                      left = extinf[:comma]
                      right = extinf[comma:]

                      return (
                          left
                          + ' group-title="'
                          + group
                          + '"'
                          + right
                      )

              return extinf

          def is_bad_url(url):
              try:
                  path = urlsplit(url).path.lower()
                  return path.endswith(bad_extensions)
              except:
                  return False

          entries = []
          seen_urls = set()

          for group, src in SOURCES:

              print("DOWNLOAD:", src)

              try:
                  req = urllib.request.Request(
                      src,
                      headers={
                          "User-Agent": UA,
                          "Accept": "*/*"
                      }
                  )

                  with urllib.request.urlopen(
                      req,
                      timeout=45
                  ) as r:

                      text = r.read().decode(
                          "utf-8-sig",
                          errors="ignore"
                      )

              except Exception as e:
                  print("SOURCE ERROR:", src, e)
                  continue

              lines = (
                  text.replace("\r\n", "\n")
                      .replace("\r", "\n")
                      .split("\n")
              )

              info = None
              extra = []

              for raw in lines:

                  line = raw.strip()

                  if not line:
                      continue

                  if line.startswith("#EXTM3U"):
                      continue

                  if line.startswith("#EXTINF"):
                      info = line
                      extra = []
                      continue

                  if info is not None and line.startswith("#"):
                      extra.append(line)
                      continue

                  if info is None:
                      continue

                  if not line.lower().startswith(allowed_schemes):
                      info = None
                      extra = []
                      continue

                  url = line.strip()

                  if is_bad_url(url):
                      info = None
                      extra = []
                      continue

                  # Убираем только полностью одинаковый поток.
                  # Каналы с одинаковым названием, но разными URL,
                  # остаются как запасные варианты.
                  key = url.lower()

                  if key in seen_urls:
                      info = None
                      extra = []
                      continue

                  seen_urls.add(key)

                  extinf = add_group(info, group)

                  entries.append(
                      (extinf, extra[:], url)
                  )

                  info = None
                  extra = []

          with open(
              "all-clean.m3u",
              "w",
              encoding="utf-8",
              newline="\n"
          ) as f:

              f.write("#EXTM3U\n")

              for extinf, extra, url in entries:

                  f.write(extinf + "\n")

                  for option in extra:
                      f.write(option + "\n")

                  f.write(url + "\n")

          with open(
              "report.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  "Total streams: "
                  + str(len(entries))
                  + "\n"
              )

          print("TOTAL STREAMS:", len(entries))
          PY

      - name: Save playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add all-clean.m3u report.txt

          git diff --cached --quiet && exit 0

          git commit -m "Update full IPTV playlist"
          git push
